name: SERP Monitor

on:
  workflow_dispatch:
  schedule:
    # Daily at 08:00 UTC.
    - cron: "0 8 * * *"

concurrency:
  group: serp-monitor-main
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Restore SERP history cache
        uses: actions/cache@v4
        with:
          path: data
          key: serp-monitor-data-${{ github.run_id }}
          restore-keys: |
            serp-monitor-data-

      - name: Run SERP monitor
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m app.main --config config.yaml

      - name: Sync latest dashboard baseline
        if: always()
        run: git pull --rebase origin main

      - name: Export dashboard data
        if: always()
        run: python scripts/export_dashboard_data.py --config config.yaml --docs-dir docs

      - name: Generate NDA-safe PR visibility report
        if: always()
        run: python scripts/generate_pr_visibility_report.py

      - name: Generate PR asset tracking report
        if: always()
        run: python scripts/generate_pr_asset_report.py

      - name: Commit dashboard and report updates
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs/data docs/screenshots docs/reports/pr_visibility reports/pr_visibility/archive reports/pr_assets
          git add docs/data/results.json docs/screenshots docs/index.html docs/styles.css docs/app.js
          git add docs/reports/pr_visibility reports/pr_visibility reports/pr_assets
          git diff --cached --quiet || git commit -m "Update dashboard and PR reports"
          git push origin HEAD:main

      - name: Upload monitor artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serp-monitor-artifacts
          path: |
            data/*.sqlite3
            data/*.json
            data/screenshots/**/*.png
            docs/data/results.json
            docs/screenshots/**/*.png
            reports/pr_visibility/**/*.md
            reports/pr_visibility/**/*.csv
            reports/pr_assets/*.md
            reports/pr_assets/*.csv
          if-no-files-found: ignore

  deploy:
    needs: monitor
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest dashboard
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy dashboard Pages
        id: deployment
        uses: actions/deploy-pages@v4
