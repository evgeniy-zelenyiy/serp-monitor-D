project:
  name: "Dmytro Rukin / LaFinteca SERM"
  database_path: "data/serp_history.sqlite3"
  screenshots_dir: "data/screenshots"
  entity_map_path: "data/entity_map.json"

monitoring:
  provider: "serper"
  country: "BR"
  language: "pt"
  location_name: "Brazil"
  device: "desktop"
  run_frequency: "daily"
  depth: 10
  demo_results_per_query: 10
  only_alert_on_changes: true
  screenshot_mode: "serp"
  track_disappeared: true
  extract_publication_date: true
  publish_dashboard: true
  queries:
    - "dmytro rukin"
    - "Dmytro Rukin"
    - "Dmitry Rukin"
    - "\"Dmytro Rukin\" fraude"
    - "LaFinteca"

sentiment:
  use_openai: true
  openai_model: "${OPENAI_MODEL:-gpt-4o-mini}"
  negative_keywords_pt:
    - "fraude"
    - "golpe"
    - "scam"
    - "investigação"
    - "processo"
    - "crime"
    - "acusação"
    - "reclamação"
    - "lavagem"
    - "irregularidade"
    - "suspeita"
    - "pirâmide"
    - "denúncia"
    - "risco"
    - "bloqueio"
    - "financeiro"
    - "fraude financeira"
    - "problema"
    - "ilegal"
    - "denúncia financeira"
    - "reclame aqui"
    - "fraud"
    - "defamatory"
    - "allegation"
    - "fake"
    - "незаконний"
    - "шахрайство"
    - "наклеп"
    - "наклепні"

screenshots:
  enabled: true
  timeout_ms: 30000
  full_page: true

domain_tags:
  owned_domains: []
  trusted_domains:
    - "linkedin.com"
    - "crunchbase.com"
    - "medium.com"
  risky_domains:
    - "rumafia.io"
    - "rumafia.news"
    - "rozsliduvach.info"
  ignored_domains: []

telegram:
  enabled: true
  mode: "digest"
  digest_only: true
  alert_on_sentiments:
    - "negative"
    - "risky"
  max_message_mentions: 20
  send_screenshots: false
  send_full_serp: false
  only_alert_on_changes: true
  skip_empty_digest: true
  dashboard_url: "https://evgeniy-zelenyiy.github.io/serp-monitor-D/"
  risk_keywords:
    - "fraud"
    - "scam"
    - "fraude"
    - "golpe"
    - "acusação"
    - "investigação"
    - "crime"
    - "processo"
    - "reclamação"
    - "pirâmide"
    - "defamatory"
    - "allegation"
    - "fake"
    - "незаконний"
    - "шахрайство"
    - "наклеп"
    - "наклепні"

entity_map:
  enabled: true

reporting:
  pr_visibility:
    enabled: true
    nda_safe: true
    anonymize_domains: true
    include_full_urls: false
    include_screenshots: false
    include_titles: false
    public_safe_domains:
      - linkedin.com
      - la-finteca.com
      - lafinteca.com
    pr_domain_keywords:
      - pr
      - news
      - business
      - finance
      - fintech
      - press
      - review
      - interview
